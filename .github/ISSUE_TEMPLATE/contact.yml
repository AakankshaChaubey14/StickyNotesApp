name: 💼 Get in touch
description: Collaboration, press, or anything else you'd like to tell us.
title: "[Contact] "
labels: ["contact"]
body:
  - type: markdown
    attributes:
      value: |
        Want to collaborate, write about the app, or just say hello? Tell us here and we'll reply in this issue.
        (No need to ask before using it: Sticky Note Scrapbook is open source under the MIT License.)
        **This issue is public**, so please don't share private details like phone numbers. We can arrange a private way to talk if needed.
  - type: dropdown
    id: topic
    attributes:
      label: What is it about?
      options:
        - Collaboration
        - Press or a feature about the app
        - Something else
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Your name or organization
  - type: textarea
    id: message
    attributes:
      label: Message
    validations:
      required: true
